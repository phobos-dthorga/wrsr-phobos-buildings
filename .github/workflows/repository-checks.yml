name: Repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  documentation-and-plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests
      - run: python scripts/check_material_sample_package.py
      - run: python scripts/prepare_material_tuning.py --check
      - run: python scripts/check_assembly_package.py
      - run: python scripts/prepare_a04_diagnostics.py
      - run: python scripts/gameplay_p01.py
      - run: python scripts/gameplay_p02.py
